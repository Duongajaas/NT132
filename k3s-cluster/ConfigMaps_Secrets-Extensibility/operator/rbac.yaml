
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-operator
  namespace: k8s-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-operator
  namespace: k8s-demo
rules:
  - apiGroups:
      - lab.nt132.example
    resources:
      - webapps
    verbs:
      - get
      - list

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-operator
  namespace: k8s-demo
subjects:
  - kind: ServiceAccount
    name: webapp-operator
    namespace: k8s-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-operator
