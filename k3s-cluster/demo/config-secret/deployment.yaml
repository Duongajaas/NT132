
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
  namespace: k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      nodeSelector:
        workload: chatapp
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 86400"]
          envFrom:
            - configMapRef:
                name: demo-config
