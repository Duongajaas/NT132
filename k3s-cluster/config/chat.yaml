apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: chat }
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Redis__Enabled: "true"
  ConnectionStrings__Redis: "redis:6379,connectTimeout=2000,asyncTimeout=2000,syncTimeout=2000"
  Redis__ChannelPrefix: "chatapp-production"
  Presence__HeartbeatSeconds: "15"
  Presence__ConnectionTtlSeconds: "60"
  Presence__SweepSeconds: "5"
  Jwt__Issuer: "ChatApp"
  Jwt__Audience: "ChatApp.Client"
  Jwt__AccessTokenMinutes: "15"
  Cors__AllowedOrigins__0: "https://192.168.56.10"
  AppUrls__FrontendBaseUrl: "https://192.168.56.10"
  Cloudinary__CloudName: ""
  Cloudinary__ApiKey: ""
  Cloudinary__AvatarUploadPreset: ""
  Calls__TurnUrls__0: ""
  Calls__TurnUrls__1: ""
  Calls__TurnUrls__2: ""
  GoogleAuth__ClientId: "<GOOGLE_CLIENT_ID>"
  Smtp__Host: "<host>"
  Smtp__Port: "2525"
  Smtp__Username: "<user>"
  Smtp__FromEmail: "<email>"
  Smtp__FromName: "ChatApp"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: chat }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args: ["redis-server", "--save", "", "--appendonly", "no"]
        ports: [{ containerPort: 6379 }]
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: chat }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: chat }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  selector: { matchLabels: { app: api } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
      - name: api
        image: 192.168.56.10:5000/chat-be:v1
        ports: [{ containerPort: 8080 }]
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
        env:
        - { name: Runtime__Role, value: "api" }
        startupProbe:
          httpGet: { path: /health/ready, port: 8080 }
          periodSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet: { path: /health/ready, port: 8080 }
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service            # headless: nginx thấy IP từng pod
metadata: { name: api, namespace: chat }
spec:
  clusterIP: None
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service            # ClusterIP thường
metadata: { name: api-lb, namespace: chat }
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: chat }
spec:
  replicas: 1
  strategy: { type: Recreate }      # tránh 2 worker chạy cùng lúc khi rollout
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
      - name: worker
        image: 192.168.56.10:5000/chat-be:v1
        envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
        env:
        - { name: Runtime__Role, value: "worker" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: chat }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: 192.168.56.10:5000/chat-fe:v1
        ports: [{ containerPort: 8443 }, { containerPort: 8080 }]
        volumeMounts:
        - { name: tls,  mountPath: /etc/nginx/tls, readOnly: true }
        - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
        readinessProbe:
          tcpSocket: { port: 8443 }
          periodSeconds: 3
      volumes:
      - { name: tls,  secret: { secretName: fe-tls } }
      - { name: conf, configMap: { name: fe-nginx } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: chat }
spec:
  selector: { app: frontend }
  ports: [{ port: 443, targetPort: 8443 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata: { name: chat, namespace: chat }
spec:
  entryPoints: [websecure]
  routes:
  - match: HostSNI(`*`)
    services: [{ name: frontend, port: 443 }]
  tls: { passthrough: true }