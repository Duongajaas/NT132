apiVersion: apps/v1
kind: Deployment
metadata: { name: whoami, namespace: chat }
spec:
  replicas: 3
  selector: { matchLabels: { app: whoami } }
  template:
    metadata: { labels: { app: whoami } }
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports: [{ containerPort: 80 }]
        readinessProbe:
          httpGet: { path: /health, port: 80 }
          periodSeconds: 2
          failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata: { name: whoami, namespace: chat }
spec:
  selector: { app: whoami }
  ports: [{ port: 80, targetPort: 80 }]