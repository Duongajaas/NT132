
resolver 10.43.0.10 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chat_http {
    zone chat_http 64k;
    least_conn;

    server api.chat.svc.cluster.local:8080 resolve max_fails=2 fail_timeout=10s;

    keepalive 32;
}

upstream chat_hubs {
    zone chat_hubs 64k;
    least_conn;

    server api.chat.svc.cluster.local:8080 resolve max_fails=2 fail_timeout=10s;

    sticky cookie chat_route httponly secure samesite=lax path=/hubs/;
}

server {
    listen 8080;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    # SSL configuration
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend configuration
    root /usr/share/nginx/html;

    # Security configuration
    client_max_body_size 64k;

    include /etc/nginx/security-headers.conf;

    # Do not log the query string:
    # SignalR can carry access_token there.
    access_log off;

    # File upload API
    location = /api/files/upload {
        client_max_body_size 9m;

        proxy_pass http://chat_http;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://chat_http;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR / WebSocket
    location /hubs/ {
        proxy_pass http://chat_hubs;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";

        include /etc/nginx/security-headers.conf;
    }

    # Index page
    location = /index.html {
        expires -1;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        include /etc/nginx/security-headers.conf;
    }

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
