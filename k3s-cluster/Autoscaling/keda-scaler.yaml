apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-cron-scaler
spec:
  scaleTargetRef:
    name: keda-demo-app
  pollingInterval: 5
  cooldownPeriod: 10
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
  - type: cron
    metadata:
      timezone: Asia/Ho_Chi_Minh
      start: "*/2 * * * *"
      end: "1-59/2 * * * *"
      desiredReplicas: "3"
